name: Build Android APK

# GitHub-hosted ubuntu-latest runners ship with the Android SDK
# preinstalled, so no SDK download step is needed here.
#
# workflow_dispatch (manual "Run workflow" button) only registers once
# this file is on the repo's default branch, so a `push` trigger is
# included too — it works on any branch immediately and needs no manual
# registration. Pushing a change under android/ or to this file rebuilds
# the APK using whatever appBaseUrl is set in android/gradle.properties.
on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override the URL the app should load (defaults to android/gradle.properties#appBaseUrl)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: android
        env:
          BASE_URL_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || '' }}
        run: |
          chmod +x gradlew
          if [ -n "$BASE_URL_OVERRIDE" ]; then
            ./gradlew assembleDebug -PappBaseUrl="$BASE_URL_OVERRIDE"
          else
            ./gradlew assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pcdc-husainiya-erp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
