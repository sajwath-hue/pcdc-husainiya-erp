<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #0b1220;
        color: #e5e9f5;
        font-family: -apple-system, "Segoe UI", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #4f7fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      p { opacity: 0.7; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <p>Starting School Pro — first launch may take a few seconds…</p>
  </body>
</html>
